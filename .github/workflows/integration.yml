name: Live Paperless integration

# Runs tests/integration/ against a real, disposable Paperless-ngx.
#
# Why this is a separate workflow rather than a job in ci.yml: ci.yml is the
# quality gate, it takes about twenty seconds a job, and nothing here may slow
# it down. Keeping the live lane out of that file means the gate's jobs are
# byte for byte the ones they were, and the live legs run beside them rather
# than after them.
#
# Where it runs, and why:
#
#   * every pull request and every push to main. Booting Paperless costs a
#     couple of minutes, which is a real tax, and it is worth paying: this is
#     the only lane that can catch a wrong query parameter or a withdrawn
#     endpoint, and that class of bug is *silent* — the client gets a 200 and
#     a plausible page of the wrong documents, so no unit test, type check or
#     review will find it. There is deliberately no paths filter: a required
#     check that skips itself on some diffs is worse than one that always runs.
#   * weekly, and on demand. The pinned matrix below only moves when someone
#     edits this file, so on its own it can never notice that a *new*
#     Paperless-ngx broke us. The scheduled `drift` job resolves the newest
#     upstream release at run time and is the thing that does.
#
# Two operational facts about this file that are easy to rediscover the hard
# way:
#
#   * `live` is only a *gate* if branch protection lists it as a required
#     check. Nothing in this file can make it required. If it is not in the
#     repository's protection rules, it is advisory and a red run can be merged
#     straight past.
#   * GitHub disables `schedule` triggers after 60 days with no repository
#     activity, and says so only by email to the repository admin. A drift
#     alarm that switches itself off during a quiet quarter is worth checking
#     for whenever this repository has been idle for a while — the Actions tab
#     shows the workflow as disabled.
#
# A red `drift` run currently signals through the workflow's own failure (and
# GitHub's scheduled-failure email) rather than opening an issue. Filing one
# automatically would need `issues: write` and de-duplication so a broken
# upstream does not open a fresh issue every Monday; that is a policy call for
# the repository owner rather than something to switch on here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, 04:17 UTC. Off the hour, because everything is on the hour.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.event_name` is part of the key on purpose. Without it a schedule
  # run and a push to main both resolve github.ref to refs/heads/main, so a
  # Monday-morning push silently cancels the weekly drift run — and a drift
  # alarm that cancels itself and says nothing is worse than no alarm.
  group: integration-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    # The two ends of the range README.md claims to support. If either end
    # stops passing, the honest fix is to change the code or change the README,
    # not to drop the failing leg from this list.
    name: Paperless-ngx ${{ matrix.paperless }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        paperless: ["2.16.0", "3.1.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start a disposable Paperless-ngx
        env:
          PAPERLESS_IT_VERSION: ${{ matrix.paperless }}
        # The script generates its own throwaway admin password and obtains an
        # API token, then exports PAPERLESS_TEST_URL/_TOKEN through GITHUB_ENV
        # with the token masked. No repository secret is involved, because
        # nothing here outlives the job.
        run: ./scripts/integration-stack.sh up

      - name: Integration tests
        # Not `npm run test:integration` directly: the suite skips itself when
        # PAPERLESS_TEST_URL is unset and vitest then exits 0, so running it
        # bare would let this job report success without touching Paperless.
        # The `test` subcommand asserts both that the URL is set and that tests
        # actually ran.
        run: ./scripts/integration-stack.sh test

      - name: Paperless logs
        if: failure()
        run: ./scripts/integration-stack.sh logs --tail 300 paperless

      - name: Tear down
        if: always()
        run: ./scripts/integration-stack.sh down

  drift:
    # Not a PR gate — see the header. This is the alarm for "upstream shipped a
    # release that breaks us", which by definition arrives without a commit
    # here for a pull-request lane to hang off.
    name: Newest upstream release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      # Its own group, and no cancel-in-progress. This job must not be
      # cancellable by anything else that happens to run on the same ref.
      group: integration-drift
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve the newest Paperless-ngx release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        # The newest *release* rather than the `latest` image tag: a tag is
        # mutable and gives no way to say in the log which version failed.
        # Pre-releases are excluded — a beta breaking us is not news.
        run: |
          set -euo pipefail
          tag="$(gh api repos/paperless-ngx/paperless-ngx/releases/latest --jq '.tag_name')"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse a version out of upstream release tag '${tag}'"
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "Newest upstream Paperless-ngx release: ${version}"

      - name: Start a disposable Paperless-ngx
        env:
          PAPERLESS_IT_VERSION: ${{ steps.resolve.outputs.version }}
        run: ./scripts/integration-stack.sh up

      - name: Integration tests
        run: ./scripts/integration-stack.sh test

      - name: Report what to do about a failure
        # Gated on `resolve` having succeeded: without that, a failure to parse
        # the upstream tag would print "the suite failed against Paperless-ngx"
        # for a run in which no suite ever started, and send the next person
        # looking in the wrong place.
        if: failure() && steps.resolve.outcome == 'success'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          echo "::warning::The integration suite failed against Paperless-ngx ${VERSION}, which is newer than anything in the pinned matrix."
          echo "Either this client needs to change, or README.md's supported range needs its upper bound corrected. Do not widen the range without a passing run."
          ./scripts/integration-stack.sh logs --tail 300 paperless

      - name: Tear down
        if: always()
        run: ./scripts/integration-stack.sh down
