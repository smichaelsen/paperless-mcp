name: Docker Publish
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # `github.repository` is already "owner/repo". The inherited upstream
          # version prefixed it with `github.actor` as well, which produced
          # ghcr.io/<owner>/<owner>/<repo> — a package named "<owner>/<repo>"
          # under the owner's namespace, not the path anyone would guess or
          # pull. `github.actor` is also whoever pushed the commit, so the
          # path moved with the pusher. The repository slug is the only
          # correct source for both segments.
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=true
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }} 