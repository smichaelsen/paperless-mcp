# Publishes @smichaelsen/paperless-mcp to the public npm registry when a GitHub
# release is created. Nothing else triggers it: no push, no tag on its own.
#
# See RELEASING.md for the human side of the process, including the one secret
# this workflow needs (NPM_TOKEN).

name: Publish to npm

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gates as ci.yml, on the same Node versions. A broken publish is
  # worse than no publish, and a release is cut from a tag that CI may never
  # have seen on its own.
  quality-gate:
    name: Type check, test and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js LTS lines (20.x is end-of-life since April 2026).
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        # Integration tests skip themselves: PAPERLESS_TEST_URL is unset here.
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the published bin entrypoint is intact
        # The bin is only executable while the shebang survives the build.
        run: |
          test -f build/index.js
          head -1 build/index.js | grep -q '^#!/usr/bin/env node'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  publish-npm:
    name: Publish to npm
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: npm exchanges this OIDC token with Sigstore
      # to attest that this tarball was built from this commit of this repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the release tag matches the package version
        # Guards against the most common release mistake: tagging v1.2.0 while
        # package.json still says 1.1.0. npm would happily publish the old
        # version under the new release's name.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          tag_version="${RELEASE_TAG#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package.json version '$pkg_version'." >&2
            echo "Bump the version on main, or retag the release, then try again." >&2
            exit 1
          fi

      - name: Publish
        # --access public: the package name is scoped (@smichaelsen/...), and
        #   scoped packages default to a restricted (paid, private) publish.
        #   Without this flag the very first publish fails with E402.
        # --provenance: publishes a signed build-provenance attestation, so
        #   consumers can verify the tarball came from this workflow run.
        #   Requires the id-token permission above and a public repository.
        # npm publish runs prepublishOnly -> npm run build, so the tarball is
        # built from this checkout rather than from anything cached.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
