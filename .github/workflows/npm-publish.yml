# Publishes @smic/paperless-mcp to the public npm registry when a GitHub
# release is published. Nothing else triggers it: no push, no tag on its own,
# no draft.
#
# Authentication is npm Trusted Publishing (OIDC): there is no stored npm
# credential. The job mints a short-lived GitHub OIDC token and exchanges it
# with npm for a publish token that lives for the length of the publish.
#
# THE FILENAME OF THIS FILE IS PART OF THE CREDENTIAL. npm matches the trusted
# publisher registration against `npm-publish.yml` exactly, case-sensitively,
# extension included. Renaming or moving this file revokes its ability to
# publish until the registration on npmjs.com is updated to match.
#
# See RELEASING.md for the human side of the process, including the one-time
# registration on npmjs.com and the token-based rollback.

name: Publish to npm

on:
  release:
    # `published`, not `created`. A release saved as a draft first — the normal
    # flow, and what the GitHub UI does by default — never produces a `created`
    # workflow run: "Workflows are not triggered for the created, edited, or
    # deleted activity types for draft releases", and `created` itself only
    # means "a draft was saved, or a release or pre-release was published
    # without previously being saved as a draft". Draft, then publish, would
    # therefore have fired nothing at all: no run, no failure, no signal.
    # `published` covers both the draft-then-publish and publish-directly
    # paths.
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gates as ci.yml, on the same Node versions. A broken publish is
  # worse than no publish, and a release is cut from a tag that CI may never
  # have seen on its own.
  quality-gate:
    name: Type check, test and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js LTS lines (20.x is end-of-life since April 2026).
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        # Integration tests skip themselves: PAPERLESS_TEST_URL is unset here.
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the published bin entrypoint is intact
        # The bin is only executable while the shebang survives the build.
        run: |
          test -f build/index.js
          head -1 build/index.js | grep -q '^#!/usr/bin/env node'

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  publish-npm:
    name: Publish to npm
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Does double duty. npm exchanges this OIDC token with the registry for a
      # short-lived publish token (Trusted Publishing), and separately with
      # Sigstore to attest that this tarball was built from this commit of this
      # repo (provenance). Without it the job has no credential at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24, not 22, and the publish job only — the quality gate keeps
          # testing both, because that is about which Node versions users may
          # run this server on, not about how it is published.
          #
          # Trusted Publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 22
          # ships npm 10.9.x to this day (v22.23.2 -> npm 10.9.8), so the old
          # `node-version: 22` is below the floor. Node 24 ships npm 11.19.0,
          # and every 24.x since 24.5.0 has shipped npm >= 11.5.1, so the
          # newest-24.x that setup-node resolves cannot land under the floor.
          # Preferred over `npm i -g npm@latest` because pulling an unpinned
          # npm from the network on every release adds exactly the kind of
          # supply-chain surface this change exists to remove.
          node-version: 24
          cache: npm
          # registry-url is deliberately NOT set, and must not be added back.
          # actions/setup-node <= v6 writes an .npmrc containing
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, points
          # NPM_CONFIG_USERCONFIG at it, and exports a placeholder
          # NODE_AUTH_TOKEN of `XXXXX-XXXXX-XXXXX-XXXXX` when the variable is
          # unset (actions/setup-node src/authutil.ts; only the unreleased v7
          # stopped doing this). That plants a junk credential behind the OIDC
          # exchange, so if trusted publishing ever fails to authenticate, npm
          # falls through to the placeholder and the run dies with an opaque
          # registry E401/E404 instead of a legible "requires you to be logged
          # in". npm defaults to https://registry.npmjs.org/ anyway, which is
          # what the OIDC audience is derived from.

      - name: Check the npm version supports trusted publishing
        # Replaces the old "is NPM_TOKEN set" guard: same idea, new failure
        # mode. Trusted Publishing is silently unavailable below npm 11.5.1 —
        # npm would simply not find a credential — so fail in seconds with a
        # sentence rather than at the last step of a release whose GitHub
        # release page is already public.
        run: |
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          required="11.5.1"
          echo "node $node_version, npm $npm_version"
          if [ "$(printf '%s\n%s\n' "$required" "$npm_version" | sort -V | head -n 1)" != "$required" ]; then
            echo "npm $npm_version is below $required, which Trusted Publishing (OIDC) requires." >&2
            echo "Raise node-version in this job, or add an explicit npm upgrade step." >&2
            exit 1
          fi

      - run: npm ci

      - name: Check the release tag matches the package version
        # Guards against the most common release mistake: tagging v1.2.0 while
        # package.json still says 1.1.0. npm would happily publish the old
        # version under the new release's name.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -p 'require("./package.json").version')"
          tag_version="${RELEASE_TAG#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Release tag '$RELEASE_TAG' does not match package.json version '$pkg_version'." >&2
            echo "Bump the version on main, or retag the release, then try again." >&2
            exit 1
          fi

      - name: Publish
        # --access public: the package name is scoped (@smic/...), and
        #   scoped packages default to a restricted (paid, private) publish.
        #   Without this flag the very first publish fails with E402.
        # --provenance: publishes a signed build-provenance attestation, so
        #   consumers can verify the tarball came from this workflow run.
        #   Requires the id-token permission above and a public repository.
        #   Kept even though trusted publishing enables provenance on its own:
        #   npm's auto-enable lives in a try/catch that swallows every error
        #   and logs it at verbose only (npm/cli lib/utils/oidc.js), so
        #   dropping the flag would make provenance a silent maybe. 0.1.0 has
        #   an attestation and losing it quietly in 0.1.1 is worse than an
        #   explicit flag the docs merely call unnecessary. Passing it also
        #   makes a provenance failure fail the publish loudly.
        # --tag: a GitHub pre-release must not land on npm's `latest`, which is
        #   what a plain `npm publish` would do and what every `npm install`
        #   without a version would then pick up. Marking the release as a
        #   pre-release in the GitHub UI is enough to route it to `next`.
        # No NODE_AUTH_TOKEN: the credential is the OIDC exchange above.
        # npm publish runs prepublishOnly -> npm run build, so the tarball is
        # built from this checkout rather than from anything cached.
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
