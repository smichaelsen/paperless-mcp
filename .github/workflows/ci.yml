name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Type check, test and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Node.js LTS lines (20.x is end-of-life since April 2026).
        # 22 is the version the package is developed on.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        # Integration tests skip themselves: PAPERLESS_TEST_URL is unset here.
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the published bin entrypoint is intact
        # The bin is only executable while the shebang survives the build.
        run: |
          test -f build/index.js
          head -1 build/index.js | grep -q '^#!/usr/bin/env node'

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
